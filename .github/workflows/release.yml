name: Release

on:
  push:
    branches: [master, next, next-major, beta, alpha, '[0-9]+.x']

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: changes-deploys
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout Maker
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --openssl-legacy-provider
        run: npx semantic-release@25

      - name: Checkout Maker deploys branch in .dist directory
        uses: actions/checkout@v6
        with:
          repository: square/maker
          ref: deploys
          path: .dist

      - name: Build & deploy Styleguide & Lab
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          cd .dist
          git config user.name github-actions
          git config user.email github-actions@github.com
          cd ..
          export DEPLOY_NAME=library_version
          npm run deploy-all-ci
